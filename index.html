  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>latex templates</title>
  </head>
  <body>
    <h1><span class="latex">L<sup>a</sup>T<sub>e</sub>X</span> Templates <a class=btn href="https://github.com/benraz123/ltx">source</a></h1>
<p class="tagline">
  A set of nix flake templates to make typesetting documents with <span class="latex">L<sup>a</sup>T<sub>e</sub>X</span> easier and more conventient.
</p>
<ul class=templates>
<li>template <strong>apaStu</strong> <a class=btn href="apaStu">link</a></li>
<!--<a class=btn href="apaStu">page</a> <a class=btn href="https://github.com/benraz123/ltx/blob/main/apaStu">source</a> <a class=btn href="{n}/example.pdf">example</a>-->

<li>template <strong>beamer</strong> <a class=btn href="beamer">link</a></li>
<!--<a class=btn href="beamer">page</a> <a class=btn href="https://github.com/benraz123/ltx/blob/main/beamer">source</a> <a class=btn href="{n}/example.pdf">example</a>-->

</ul>

    <style>
      .tex sub, .latex sub, .latex sup {
        text-transform: uppercase;
      }

      .tex sub, .latex sub {
        vertical-align: -0.5ex;
        margin-left: -0.1667em;
        margin-right: -0.125em;
      }

      .tex, .latex, .tex sub, .latex sub {
        font-size: 1em;
      }

      .latex sup {
        font-size: 0.85em;
        vertical-align: 0.15em;
        margin-left: -0.36em;
        margin-right: -0.15em;
      }

      :root {
        --bg: white;
        --fg: black;
        --dim: gray;
        --link: blue;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111;
          --fg: white;
          --dim: #999;
          --link: #abf;
        }
      }
      *{
        color: var(--fg);
      }
      html {
        background-color: var(--bg);
      }
      a {
        color: var(--link);
      }
      a.btn {
        font-size: smaller;
        font-weight: normal;
        color: var(--fg);
        text-decoration: none;
      }

      a.btn::before {
        content: "[";
        color: var(--dim);
      }

      a.btn::after {
        content: "]";
        color: var(--dim);
      }

      smaller {
        font-size:smaller
      } 
      *{
        font-family:sans-serif
      }
      pre,code {
        font-family: monospace
      }
      p.tagline, p.tagline * {
        color: var(--dim);
        font-weight: bold;
        font-style: italic;
      }

      ul.templates {
        font-size: bigger;
        list-style-type: "> ";
      }

    </style>
  </body>
</html>
